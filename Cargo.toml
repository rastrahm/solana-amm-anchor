[workspace]
members = [
    "programs/*"
]
resolver = "2"

# Solana CLI 2.2 defaults to platform-tools v1.48 (cargo 1.84), which cannot
# parse crates with edition2024 pulled by current Anchor/solana-program deps.
[workspace.metadata.solana]
tools-version = "v1.52"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
